name: Deploy do Vite/React para GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # mude para 'yarn' ou 'pnpm' se usar outro gerenciador

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Upload dos arquivos gerados (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta padrão de saída do Vite

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4