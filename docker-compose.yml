services:
  brand-kit-dev:
    image: node:22-alpine
    container_name: nexa_brand_kit_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development

  brand-kit-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_brand_kit_prod
    ports:
      - "8080:80"
